version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      # Mount the main configuration file read only
      - ${NGINX_CONFIG_PATH}/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount the configuration directory for server blocks / virtual hosts read only
      - ${NGINX_CONFIG_PATH}/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend-net
      - backend-net

networks:
  frontend-net:
    external: true
  backend-net:
    external: true
