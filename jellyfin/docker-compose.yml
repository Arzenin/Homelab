services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}:/config
      - ${CACHE_DIR}:/cache
      - ${MEDIA_DIR}:/media
      # Calibre library mounted as a subfolder of /media, read-only:
      # Jellyfin can read it but never delete or modify it
      - ${BOOKS_DIR}:/media/books:ro
    networks:
      - backend-net

networks:
  backend-net:
    external: true
