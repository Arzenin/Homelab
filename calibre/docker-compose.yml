version: "3.8"

services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ${CONFIG_PATH}:/config
      - ${BOOKS_PATH}:/books
    networks:
      - backend-net
      - internet-net
    restart: unless-stopped

networks:
  backend-net:
    external: true
  internet-net:
    external: true
