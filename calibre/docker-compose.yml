services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Madrid
      # Mod that installs calibredb / ebook-convert in /usr/bin (required to
      # embed metadata in downloads). Needs internet access when the container is created.
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ${CONFIG_PATH}:/config
      - ${BOOKS_PATH}:/books
    networks:
      - backend-net    # internal: nginx reaches calibre-web through this network
      - internet-net   # outbound internet only: needed to download the mod
    restart: unless-stopped

networks:
  backend-net:
    external: true
  internet-net:
    external: true
