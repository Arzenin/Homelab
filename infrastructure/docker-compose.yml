version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "${PORTAINER_HTTP_PORT}:8000"
      - "${PORTAINER_HTTPS_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PORTAINER_DATA_PATH}:/data

networks:
  frontend-net:
    driver: bridge
    name: frontend-net
  backend-net:
    driver: bridge
    name: backend-net
    internal: true
