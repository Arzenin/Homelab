version: '3.8'

services:
  web-app:
    image: node:20-alpine
    restart: always
    deploy:
      replicas: 3
    volumes:
      - ${APP_PATH}:/app
    working_dir: /app
    # Modificado: Ejecuta el build y luego arranca la app en el mismo ciclo de inicio
    command: sh -c "npm run build && npm start"
    environment:
      - PORT=3000
    networks:
      - backend-net

networks:
  backend-net:
    external: true
