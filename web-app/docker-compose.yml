version: '3.8'

services:
  web-app:
    image: node:20-alpine
    restart: always
    deploy:
      replicas: 3
    # Maps your local server directory to the container's /app directory using the .env variable
    volumes:
      - ${APP_PATH}:/app
    working_dir: /app
    # Installs dependencies, builds the Next.js app, and starts the server
    command: sh -c "npm install && npm run build && npm start"
    environment:
      - PORT=3000
    networks:
      - backend-net

networks:
  backend-net:
    external: true
