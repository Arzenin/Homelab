version: '3.8'

services:
  web-app:
    image: node:20-alpine
    restart: always
    deploy:
      replicas: 3
    volumes:
      - ${APP_PATH}:/app
    working_dir: /app
    # Modificado: Solo arranca la aplicación ya compilada, sin intentar descargar nada
    command: npm start
    environment:
      - PORT=3000
    networks:
      - backend-net

networks:
  backend-net:
    external: true
